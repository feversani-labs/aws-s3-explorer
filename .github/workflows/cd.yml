name: "CD - Deploy to EC2"

on:
  workflow_run:
    workflows: ["CI - Docker Build & Push"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de Docker a desplegar (default: latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.REGION || 'us-east-1' }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.REGION || 'us-east-1' }}

      - name: Deploy application via AWS SSM
        run: |
          echo "==> Buscando EC2 Instance ID desde SSM o Tags..."
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=*s3-explorer*" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No se encontró instancia EC2 activa con tag Name=*s3-explorer*. Verificá que la infra esté creada."
            exit 1
          fi

          echo "Instancia encontrada: $INSTANCE_ID"
          echo "==> Enviando comando de actualización de contenedor via AWS SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker pull feversani/aws-s3-explorer:'"$IMAGE_TAG"'",
              "docker stop s3-explorer 2>/dev/null || true",
              "docker rm s3-explorer 2>/dev/null || true",
              "docker run -d --restart always --name s3-explorer -p 80:8080 feversani/aws-s3-explorer:'"$IMAGE_TAG"'"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command enviado (ID: $COMMAND_ID). Esperando resultado..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          echo "✅ Despliegue en EC2 completado exitosamente!"
