name: "Terraform Deploy"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.REGION || 'us-east-1' }}
      TF_VAR_region: ${{ vars.REGION || 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for CI if active for this commit
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==> Verificando si CI - Docker Build & Push fue disparado para este commit (${{ github.sha }})..."
          
          # Esperar brevemente (hasta 15s) para que el evento de CI se registre en GitHub Actions si fue un push simultáneo
          RUN_ID=""
          for i in {1..5}; do
            RUN_ID=$(gh run list --workflow "CI - Docker Build & Push" --commit "${{ github.sha }}" --json databaseId,status --jq '.[0].databaseId' 2>/dev/null || true)
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              break
            fi
            sleep 3
          done

          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            echo "⏳ CI detectado (Run ID: $RUN_ID). Esperando que finalice exitosamente antes de ejecutar Terraform..."
            gh run watch "$RUN_ID" --exit-status
            echo "✅ CI completado con éxito. Procediendo con Terraform..."
          else
            echo "ℹ️  No se detectó ejecución de CI para este commit. Procediendo inmediatamente con Terraform."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.6.0' }}

      - name: Terraform Init
        run: |
          BUCKET=$(aws ssm get-parameter --name "/ephemeral-aws-sandbox/tfstate/bucket_name" --query "Parameter.Value" --output text)
          terraform init \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=${{ github.event.repository.name }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
